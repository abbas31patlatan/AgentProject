name: Agent Hub Index

on:
  push:
    branches:
      - agent-hub
    paths:
      - game_bridge/coordination/runtime/**
      - '!game_bridge/coordination/runtime/state/**'

permissions:
  contents: write

concurrency:
  group: agent-hub-index
  cancel-in-progress: false

jobs:
  validate-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate coordination records
        run: python3 game_bridge/coordination/validate_runtime.py

      - name: Build and publish compact snapshot with retry
        run: |
          set -e
          git config user.name "agent-hub[bot]"
          git config user.email "agent-hub@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin agent-hub
            git reset --hard origin/agent-hub
            python3 game_bridge/coordination/validate_runtime.py
            python3 game_bridge/coordination/build_snapshot.py
            git add game_bridge/coordination/runtime/state/snapshot.json

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "hub: refresh coordination snapshot"
            if git push origin HEAD:agent-hub; then
              exit 0
            fi

            echo "Concurrent hub update detected; rebuilding snapshot (attempt $attempt)"
            sleep 2
          done

          echo "Could not publish snapshot after retries" >&2
          exit 1
